:root{font-family:Tahoma,Arial,sans-serif;color:#172436;background:#f4f6fa;--brand:#653bbc;--line:#dce3ed}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 15px;color:inherit}button:hover{background:#eee8fb}button.primary{background:var(--brand);color:white;border:0}.metric.alert{border:2px solid #dc2626;background:#fff1f2;color:#991b1b}.metric.alert strong{color:#dc2626}button.danger{color:#b32635}button:disabled{opacity:.5;cursor:default}a{color:var(--brand)}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}aside{background:#172237;color:#dce5f5;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}aside h1{font-size:25px;color:white;margin:0 12px 5px}aside p{font-size:12px;margin:0 12px 25px;color:#9facc4}nav button{display:block;width:100%;text-align:right;background:transparent;color:inherit;border:0;margin:3px 0}nav button.active{background:#6748a4;color:white}nav details{margin:6px 0}summary{cursor:pointer;padding:12px;font-weight:bold}nav details details{margin-right:12px}nav .sub{margin-right:18px;border-right:1px solid #43506a;padding-right:8px}main{padding:28px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h2{margin:0;font-size:25px}h3{font-size:17px}.muted{color:#64748b;font-size:13px;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.metric{text-align:right;padding:22px;background:white;min-height:130px;box-shadow:0 3px 12px #16223805}.metric strong{display:block;font-size:30px;margin-top:12px;color:var(--brand)}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin:15px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;align-items:center}input,select,textarea{padding:11px;border:1px solid #b
