<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة خدووم</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172436;background:#f4f6fa;--brand:#653bbc;--line:#dce3ed}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 15px;color:inherit}button:hover{background:#eee8fb}button.primary{background:var(--brand);color:white;border:0}button.danger{color:#b32635}button:disabled{opacity:.5;cursor:default}a{color:var(--brand)}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}aside{background:#172237;color:#dce5f5;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}aside h1{font-size:25px;color:white;margin:0 12px 5px}aside p{font-size:12px;margin:0 12px 25px;color:#9facc4}nav button{display:block;width:100%;text-align:right;background:transparent;color:inherit;border:0;margin:3px 0}nav button.active{background:#6748a4;color:white}nav details{margin:6px 0}summary{cursor:pointer;padding:12px;font-weight:bold}nav details details{margin-right:12px}nav .sub{margin-right:18px;border-right:1px solid #43506a;padding-right:8px}main{padding:28px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h2{margin:0;font-size:25px}h3{font-size:17px}.muted{color:#64748b;font-size:13px;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.metric{text-align:right;padding:22px;background:white;min-height:130px;box-shadow:0 3px 12px #16223805}.metric strong{display:block;font-size:30px;margin-top:12px;color:var(--brand)}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin:15px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;align-items:center}input,select,textarea{padding:11px;border:1px solid #b9c5d5;border-radius:8px;max-width:100%;background:white;color:inherit}textarea{min-height:90px}label{display:grid;gap:7px;margin:12px 0;font-size:14px}label.check{display:flex;align-items:center}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:right;padding:14px;border-bottom:1px solid #e9edf3;max-width:420px}td.wrap{white-space:normal;min-width:190px;line-height:1.7}th{background:#eef1f7;color:#475569}.tag{border-radius:15px;background:#ede8f9;color:#603dac;padding:5px 10px}.empty{padding:45px;text-align:center;color:#64748b}.note{padding:14px;border-right:4px solid #a28acb;background:#f0ebfa;line-height:1.9;margin:15px 0}.error{color:#a51d31;background:#fff0f1;padding:12px;border-radius:10px}.login{max-width:420px;margin:8vh auto;background:white;border:1px solid var(--line);border-radius:20px;padding:30px}.login input{width:100%}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:650px;width:90%;max-height:90vh;padding:24px}dialog::backdrop{background:#15213788}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.stats{display:flex;gap:20px;flex-wrap:wrap}#flash{position:fixed;bottom:20px;left:20px;z-index:10;max-width:80vw;background:#172237;color:white;padding:16px;border-radius:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap}img.ad{max-width:180px;max-height:100px;border-radius:8px}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:15px}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}.formgrid{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style></head><body>
<section id="login" class="login"><h1>خدووم</h1><h2>لوحة الإدارة</h2><p class="muted">حساب مستقل لكل موظف، وصلاحيات تناسب عمله.</p><form id="staffLogin"><label>اسم المستخدم<input name="username" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">دخول الموظف</button></form><details><summary>دخول المالك</summary><form id="ownerLogin"><label>مفتاح المالك<input name="key" type="password" required autocomplete="off"></label><button class="primary">دخول المالك</button></form></details><p id="loginError" role="alert"></p></section>
<div id="app" class="shell" hidden><aside><h1>خدووم</h1><p>الإدارة والمتابعة</p><nav id="nav"></nav></aside><main><header class="top"><div><p class="muted" id="breadcrumb">لوحة الإدارة</p><h2 id="title">الرئيسية</h2></div><div><span id="identity" class="muted"></span> <button id="refresh">تحديث</button> <button id="logout">خروج</button></div></header><section id="content" aria-live="polite"></section></main></div>
<dialog id="modal"><h2 id="modalTitle"></h2><form id="editor"><div id="fields" class="formgrid"></div><p id="formError" class="error" hidden></p><div class="toolbar"><button class="primary" type="submit">حفظ</button><button type="button" id="cancel">إلغاء</button></div></form></dialog><div id="flash" role="status" hidden></div><script src="/owner/dashboard.js"></script><script src="/owner/addons.js"></script></body></html>
