name: Build Khdoom Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'build_support/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Create Android platform files
        run: |
          rm -rf /tmp/khdoom_android
          flutter create --platforms=android --org com.khdoom --project-name app /tmp/khdoom_android
          rm -rf ./android
          cp -R /tmp/khdoom_android/android ./android
          cp build_support/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R build_support/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/kotlin/com/khdoom/app
          cp build_support/MainActivity.kt android/app/src/main/kotlin/com/khdoom/app/MainActivity.kt
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then mkdir -p "$HOME/.android"; echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"; fi
          cp build_support/DriverTrackingService.kt build_support/DriverTrackingBridge.kt android/app/src/main/kotlin/com/khdoom/app/
          sed -i 's/package com\.example\.untitled1/package com.khdoom.app/' android/app/src/main/kotlin/com/khdoom/app/MainActivity.kt
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts <<'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          EOF
      - name: Get Flutter packages
        run: flutter pub get
      - name: Verify advertisement rendering
        run: |
          flutter test test/advertisement_banner_test.dart
          python -m pip install -r requirements.txt
          python -m unittest test_ad_banner_feed test_advertisements.AdRulesTest.test_subscriber_cap_and_owner_control test_advertisements.AdRulesTest.test_status_at_exact_expiration -q
          node test_ad_banner_display.js
      - name: Build installable APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khdoom-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk Khdoom-latest.apk
          gh release create "khdoom-build-${{ github.run_number }}" Khdoom-latest.apk \
            --title "Khdoom Android build ${{ github.run_number }}" \
            --notes "Installable Khdoom Android package."
